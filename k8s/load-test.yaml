apiVersion: batch/v1
kind: Job
metadata:
  name: iris-load-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: iris-api:v2
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          command: [python, -u, -c]
          args:
            - |
              import concurrent.futures, json, time, urllib.request
              deadline = time.monotonic() + 90
              payload = json.dumps({'instances': [[5.1,3.5,1.4,0.2]]}).encode()
              def worker(_):
                  ok = errors = 0
                  while time.monotonic() < deadline:
                      try:
                          req = urllib.request.Request('http://iris-api/predict', data=payload, headers={'Content-Type':'application/json'})
                          with urllib.request.urlopen(req, timeout=15) as response:
                              assert json.load(response)['predictions'] == [0]
                          ok += 1
                      except Exception:
                          errors += 1
                  return ok, errors
              with concurrent.futures.ThreadPoolExecutor(max_workers=30) as pool:
                  results = list(pool.map(worker, range(30)))
              print(json.dumps({'successful_predictions':sum(x[0] for x in results), 'errors':sum(x[1] for x in results), 'duration_seconds':90, 'workers':30}))
